name: Rust

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/src/**'
      - 'api/Cargo.*'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - 'api/python/**'
      - '.github/workflows/rust.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: 'api/.python-version'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('api/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: true
          cache-workspaces: api
      - run: cd api && cargo fmt --check
      - run: cd api && cargo check
      - run: cd api && cargo clippy -- -D warnings
      - run: cd api && uv run maturin develop
