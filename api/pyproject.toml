[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.123",
    "fastapi[standard]>=0.162.0",
    "psycopg2>=2.9.13",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.2",
    "shapely>=2.2.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "maturin>=1.16.0",
    "mypy>=2.4.1",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
    "types-boto3>=1.43.123",
    "ty>=0.0.98",
    "hypothesis>=6.170.14",
    "types-shapely>=2.1.0.20261030",
]

[build-system]
requires = ["maturin>=1.16.0,<2.0"]
build-backend = "maturin"

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.coverage.run]
relative_files = true

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"

[project.scripts]
cli = "api.cli:app"
